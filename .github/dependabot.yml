# Weekly version bumps as pull requests: Python packages (requirements.txt, hashes included), the
# base image and the reusable workflows (pipelines tags).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
